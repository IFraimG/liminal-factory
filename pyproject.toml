[project]
name = "liminal-factory"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3", "httpx>=0.28,<1", "numpy>=2,<3", "soundfile>=0.13,<1", "pillow>=11,<13", "keyring>=25,<26", "python-multipart>=0.0.20"]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "pyinstaller>=6"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]
